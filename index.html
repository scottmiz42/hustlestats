<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hustle Stats">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Hustle Stats Basketball</title>
  <style>
    :root{
      --bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;
      --orange:#f97316;--orange2:#ea580c;--green:#16a34a;--red:#dc2626;--nav:#111827;
      --shadow:0 12px 30px rgba(17,24,39,.10);--radius:22px
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{min-height:100vh}
    button,input{font:inherit}
    button{touch-action:manipulation}
    .app{max-width:820px;margin:auto;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
    .topbar{
      background:linear-gradient(135deg,#111827,#1f2937);color:white;padding:18px 16px 22px;
      position:sticky;top:0;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.2)
    }
    .brand{display:flex;align-items:center;gap:10px}
    .ball{font-size:30px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:#d1d5db;font-size:12px}
    .content{padding:15px}
    .view{display:none}.view.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .setup{padding:16px;margin-bottom:14px}
    .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:1;color:var(--muted);margin-bottom:6px}
    input{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#f9fafb;outline:none}
    input:focus{border-color:#fb923c;box-shadow:0 0 0 3px rgba(251,146,60,.2)}
    .scoreboard{
      background:linear-gradient(135deg,#fff7ed,#ffedd5);padding:16px;margin-bottom:14px;
      display:grid;grid-template-columns:1fr auto;align-items:center
    }
    .scoreboard small{color:#9a3412;font-weight:1;text-transform:uppercase;letter-spacing:.06em}
    .scoreboard h2{margin:5px 0 0;font-size:20px}
    .hustle-score{text-align:center;background:#111827;color:white;border-radius:18px;padding:12px 16px;min-width:100px}
    .hustle-score .n{font-size:34px;font-weight:1;line-height:1}
    .hustle-score .t{font-size:10px;color:#d1d5db;text-transform:uppercase;font-weight:1;margin-top:4px}
    .stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .stat-card{position:relative;overflow:hidden;min-height:145px}
    .stat-main{width:100%;height:110px;border:0;background:white;padding:12px;cursor:pointer}
    .stat-main:active{background:#fff7ed;transform:scale(.985)}
    .stat-icon{font-size:28px}.stat-label{font-weight:1;font-size:15px;margin-top:5px}
    .stat-value{font-size:36px;font-weight:1;color:var(--orange2);line-height:1;margin-top:5px}
    .stat-foot{position:absolute;left:11px;bottom:12px;color:#9ca3af;font-size:10px;font-weight:1}
    .minus{position:absolute;right:10px;bottom:9px;width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:#f9fafb;font-size:22px;color:#6b7280}
    .minus:active{background:#fee2e2;color:var(--red)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .btn{border:0;border-radius:14px;padding:13px;font-weight:1;cursor:pointer}
    .btn:active{transform:scale(.985)}
    .primary{background:var(--orange2);color:white}.dark{background:#111827;color:white}.soft{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
    .section-title{display:flex;justify-content:space-between;align-items:end;margin:5px 2px 11px}
    .section-title h2{margin:0;font-size:21px}.section-title span{font-size:12px;color:var(--muted)}
    .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:15px}
    .summary-card{padding:15px}.summary-card .k{font-size:12px;color:var(--muted);font-weight:1;text-transform:uppercase}.summary-card .v{font-size:31px;font-weight:1;margin-top:5px}
    .chart{padding:16px;margin-bottom:15px}.bar-row{display:grid;grid-template-columns:115px 1fr 36px;gap:8px;align-items:center;margin:10px 0}
    .bar-label{font-size:12px;font-weight:1}.bar-track{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#fb923c,#ea580c);border-radius:99px}.bar-num{text-align:right;font-weight:1;font-size:13px}
    .game-list{overflow:hidden}.game-row{padding:15px;border-bottom:1px solid var(--line)}.game-row:last-child{border-bottom:0}
    .game-head{display:flex;justify-content:space-between;gap:10px}.game-name{font-weight:1}.game-date{color:var(--muted);font-size:12px}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{background:#f3f4f6;border-radius:99px;padding:5px 8px;font-size:10px;color:#374151}
    .row-actions{display:flex;gap:8px;margin-top:10px}.tiny{border:0;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:1}
    .empty{text-align:center;padding:28px;color:var(--muted)}
    .nav{
      position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(820px,100%);
      display:grid;grid-template-columns:repeat(3,1fr);background:rgba(17,24,39,.97);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20
    }
    .nav button{border:0;background:transparent;color:#9ca3af;padding:8px 4px;font-size:11px;font-weight:1}
    .nav button.active{color:white}.nav .ico{display:block;font-size:22px;margin-bottom:3px}
    .toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111827;color:white;padding:10px 14px;border-radius:12px;opacity:0;transition:.2s;z-index:30;font-size:12px;font-weight:1}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(min-width:680px){.stats-grid{grid-template-columns:repeat(4,1fr)}.summary-grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:420px){.setup-grid{grid-template-columns:1fr}.bar-row{grid-template-columns:98px 1fr 30px}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="ball">🏀</div><div><h1>Hustle Stats</h1><p>Youth basketball effort tracker</p></div></div>
  </header>

  <main class="content">
    <section id="gameView" class="view active">
      <div class="card setup">
        <div class="setup-grid">
          <div><label for="player">Player</label><input id="player" placeholder="Player name"></div>
          <div><label for="opponent">Opponent / Game</label><input id="opponent" placeholder="e.g. vs. Tigers"></div>
        </div>
      </div>

      <div class="card scoreboard">
        <div><small>Current game</small><h2 id="gameTitle">Ready to track</h2></div>
        <div class="hustle-score"><div class="n" id="hustleScore">0</div><div class="t">Hustle score</div></div>
      </div>

      <div class="stats-grid" id="statsGrid"></div>

      <div class="actions">
        <button class="btn soft" id="undoBtn">↶ Undo</button>
        <button class="btn primary" id="saveBtn">✓ Finish & Save</button>
        <button class="btn dark" id="newBtn">＋ New Game</button>
        <button class="btn danger" id="resetBtn">Reset Stats</button>
      </div>
    </section>

    <section id="seasonView" class="view">
      <div class="section-title"><h2>Season Dashboard</h2><span id="seasonSubtitle"></span></div>
      <div class="summary-grid">
        <div class="card summary-card"><div class="k">Games</div><div class="v" id="gamesCount">0</div></div>
        <div class="card summary-card"><div class="k">Total Plays</div><div class="v" id="seasonTotal">0</div></div>
        <div class="card summary-card"><div class="k">Avg / Game</div><div class="v" id="avgGame">0</div></div>
        <div class="card summary-card"><div class="k">Best Game</div><div class="v" id="bestGame">0</div></div>
      </div>
      <div class="card chart">
        <div class="section-title"><h2>Season Totals</h2><span>By category</span></div>
        <div id="bars"></div>
      </div>
      <button class="btn primary" style="width:100%" id="exportBtn">⇩ Export Season CSV</button>
    </section>

    <section id="historyView" class="view">
      <div class="section-title"><h2>Game History</h2><span>Saved on this device</span></div>
      <div class="card game-list" id="gameList"></div>
      <button class="btn danger" style="width:100%;margin-top:12px" id="clearBtn">Clear All Games</button>
    </section>
  </main>
</div>

<nav class="nav">
  <button class="active" data-view="gameView"><span class="ico">🏀</span>Game</button>
  <button data-view="seasonView"><span class="ico">📊</span>Season</button>
  <button data-view="historyView"><span class="ico">🗓️</span>History</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const STATS = [
  {key:"deflections",label:"Deflections",icon:"🖐️",weight:1},
  {key:"fiftyFifty",label:"50/50 Wins",icon:"💥",weight:1},
  {key:"boxOuts",label:"Box Outs",icon:"🧱",weight:1},
  {key:"rebounds",label:"Rebounds",icon:"🏀",weight:1},
  {key:"bouncePasses",label:"Bounce Passes",icon:"↘️",weight:1},
  {key:"highFives",label:"High Fives",icon:"🙌",weight:1},
  {key:"layups",label:"Layup Attempts",icon:"⛹️",weight:1}
];
const CURRENT_KEY="hustle_bball_current_v2", HISTORY_KEY="hustle_bball_history_v2";
const zeroStats=()=>Object.fromEntries(STATS.map(s=>[s.key,0]));
let current={player:"",opponent:"",date:new Date().toISOString(),stats:zeroStats(),actions:[]};
let history=[];
const $=id=>document.getElementById(id);

function load(){
  try{
    const c=JSON.parse(localStorage.getItem(CURRENT_KEY));
    const h=JSON.parse(localStorage.getItem(HISTORY_KEY));
    if(c?.stats) current=c;
    if(Array.isArray(h)) history=h;
  }catch(e){}
}
function persist(){
  current.player=$("player").value.trim();
  current.opponent=$("opponent").value.trim();
  localStorage.setItem(CURRENT_KEY,JSON.stringify(current));
  localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
}
function total(stats=current.stats){return Object.values(stats).reduce((a,b)=>a+Number(b||0),0)}
function score(stats=current.stats){return STATS.reduce((n,s)=>n+(stats[s.key]||0)*s.weight,0)}
function renderGame(){
  $("player").value=current.player||"";
  $("opponent").value=current.opponent||"";
  $("gameTitle").textContent=current.opponent||"Ready to track";
  $("hustleScore").textContent=score();
  const grid=$("statsGrid"); grid.innerHTML="";
  STATS.forEach(s=>{
    const card=document.createElement("article");
    card.className="card stat-card";
    card.innerHTML=`<button class="stat-main" data-add="${s.key}">
      <div class="stat-icon">${s.icon}</div><div class="stat-label">${s.label}</div>
      <div class="stat-value" id="v-${s.key}">${current.stats[s.key]||0}</div></button>
      <div class="stat-foot">Tap to add · 1 point</div>
      <button class="minus" data-minus="${s.key}">−</button>`;
    grid.appendChild(card);
  });
  grid.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>change(b.dataset.add,1,true));
  grid.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>change(b.dataset.minus,-1,true));
}
function change(key,delta,record){
  const before=current.stats[key]||0, after=Math.max(0,before+delta);
  if(before===after)return;
  current.stats[key]=after;
  if(record)current.actions.push({key,delta:after-before});
  const el=$(`v-${key}`); if(el)el.textContent=after;
  $("hustleScore").textContent=score();
  persist();
  if(navigator.vibrate)navigator.vibrate(18);
}
function undo(){
  const a=current.actions.pop();
  if(!a)return toast("Nothing to undo");
  change(a.key,-a.delta,false);toast("Last change undone");
}
function saveGame(){
  if(total()===0)return toast("Track at least one play first");
  current.player=$("player").value.trim()||"Player";
  current.opponent=$("opponent").value.trim()||"Game";
  history.unshift({id:Date.now(),player:current.player,opponent:current.opponent,date:new Date().toISOString(),stats:{...current.stats},score:score()});
  persist(); renderSeason(); renderHistory(); toast("Game saved");
}
function newGame(){
  const player=$("player").value.trim();
  current={player,opponent:"",date:new Date().toISOString(),stats:zeroStats(),actions:[]};
  renderGame();persist();toast("New game ready");
}
function resetStats(){
  if(total() && !confirm("Reset current game stats?"))return;
  current.stats=zeroStats();current.actions=[];renderGame();persist();toast("Stats reset");
}
function renderSeason(){
  const games=history.length, totals=zeroStats();
  history.forEach(g=>STATS.forEach(s=>totals[s.key]+=(g.stats[s.key]||0)));
  const seasonTotal=history.reduce((n,g)=>n+total(g.stats),0);
  const best=Math.max(0,...history.map(g=>g.score||score(g.stats)));
  $("gamesCount").textContent=games;
  $("seasonTotal").textContent=seasonTotal;
  $("avgGame").textContent=games?(seasonTotal/games).toFixed(1):"0";
  $("bestGame").textContent=best;
  $("seasonSubtitle").textContent=games?`${games} saved game${games===1?"":"s"}`:"No games yet";
  const max=Math.max(1,...Object.values(totals));
  $("bars").innerHTML=STATS.map(s=>`<div class="bar-row">
    <div class="bar-label">${s.label}</div><div class="bar-track"><div class="bar-fill" style="width:${(totals[s.key]/max)*100}%"></div></div>
    <div class="bar-num">${totals[s.key]}</div></div>`).join("");
}
function renderHistory(){
  const el=$("gameList");
  if(!history.length){el.innerHTML='<div class="empty">No saved games yet.</div>';return;}
  el.innerHTML=history.map(g=>`<div class="game-row">
    <div class="game-head"><div><div class="game-name">${esc(g.player)} — ${esc(g.opponent)}</div><div class="game-date">${fmt(g.date)}</div></div><div class="hustle-score" style="padding:8px 10px;min-width:72px"><div class="n" style="font-size:24px">${g.score||score(g.stats)}</div><div class="t">Score</div></div></div>
    <div class="chips">${STATS.map(s=>`<span class="chip">${s.label}: ${g.stats[s.key]||0}</span>`).join("")}</div>
    <div class="row-actions"><button class="tiny" style="background:#ffedd5;color:#9a3412" data-load="${g.id}">Load</button><button class="tiny" style="background:#fee2e2;color:#991b1b" data-del="${g.id}">Delete</button></div>
  </div>`).join("");
  el.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>loadGame(Number(b.dataset.load)));
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteGame(Number(b.dataset.del)));
}
function loadGame(id){
  const g=history.find(x=>x.id===id);if(!g)return;
  current={player:g.player,opponent:g.opponent,date:new Date().toISOString(),stats:{...g.stats},actions:[]};
  renderGame();persist();switchView("gameView");toast("Game loaded");
}
function deleteGame(id){history=history.filter(g=>g.id!==id);persist();renderSeason();renderHistory();toast("Game deleted")}
function clearAll(){if(!history.length)return;if(!confirm("Delete all saved games?"))return;history=[];persist();renderSeason();renderHistory();toast("History cleared")}
function exportCSV(){
  if(!history.length)return toast("No saved games to export");
  const headers=["Date","Player","Opponent",...STATS.map(s=>s.label),"Hustle Score"];
  const rows=history.map(g=>[fmt(g.date),g.player,g.opponent,...STATS.map(s=>g.stats[s.key]||0),g.score||score(g.stats)]);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`hustle-stats-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);toast("CSV exported");
}
function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===id));
  if(id==="seasonView")renderSeason();if(id==="historyView")renderHistory();
}
function fmt(v){return new Date(v).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600)}
load();renderGame();renderSeason();renderHistory();
$("player").oninput=()=>{current.player=$("player").value;$("gameTitle").textContent=$("opponent").value||"Ready to track";persist()}
$("opponent").oninput=()=>{current.opponent=$("opponent").value;$("gameTitle").textContent=$("opponent").value||"Ready to track";persist()}
$("undoBtn").onclick=undo;$("saveBtn").onclick=saveGame;$("newBtn").onclick=newGame;$("resetBtn").onclick=resetStats;$("exportBtn").onclick=exportCSV;$("clearBtn").onclick=clearAll;
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>switchView(b.dataset.view));
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script>
</body>
</html>
